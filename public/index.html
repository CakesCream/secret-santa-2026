<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa 2026 🎄</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #102c24, #245644);
  font-family: Arial, sans-serif;
  padding: 20px;
}

.card {
  background: #fbf5e9;
  border-radius: 25px;
  padding: 30px 25px;
  text-align: center;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 15px 50px #0005;
  overflow: hidden;
}

.tree {
  font-size: 60px;
}

h1 {
  color: #173b30;
  font-size: 36px;
  margin: 12px 0;
}

p {
  color: #68736a;
  line-height: 1.6;
}

button {
  background: #a84440;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 18px;
  width: 100%;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .7;
}

.hidden {
  display: none !important;
}

/* PRESENT */

.gift-area {
  height: 230px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  margin: 5px 0 15px;
}

.gift {
  position: relative;
  width: 150px;
  height: 135px;
  margin-top: 35px;
}

.gift-base {
  position: absolute;
  bottom: 0;
  left: 10px;
  width: 130px;
  height: 95px;
  background: linear-gradient(135deg, #d9534f, #a52e35);
  border-radius: 5px 5px 12px 12px;
  box-shadow: 0 12px 18px #0003;
  z-index: 2;
}

.gift-base::before {
  content: "";
  position: absolute;
  left: 53px;
  width: 24px;
  height: 100%;
  background: #f2cc75;
}

.gift-lid {
  position: absolute;
  top: 15px;
  left: 0;
  width: 150px;
  height: 30px;
  background: #e36b5c;
  border-radius: 6px;
  z-index: 4;
  transform-origin: 15% 100%;
  transition: transform 1s cubic-bezier(.2,.8,.3,1);
}

.gift-lid::before {
  content: "";
  position: absolute;
  left: 63px;
  width: 24px;
  height: 100%;
  background: #f7d98a;
}

.bow {
  position: absolute;
  top: -30px;
  left: 48px;
  font-size: 48px;
  z-index: 5;
  transition: transform 1s ease;
}

.gift-area.opening .gift-lid {
  transform: translate(-45px, -105px) rotate(-38deg);
}

.gift-area.opening .bow {
  transform: translate(-45px, -105px) rotate(-38deg);
}

/* SPARKLES */

.sparkle {
  position: absolute;
  font-size: 30px;
  opacity: 0;
  pointer-events: none;
}

.gift-area.opening .sparkle {
  animation: sparkle 1.5s ease-out forwards;
}

.sparkle:nth-child(1) {
  top: 15px;
  left: 12%;
}

.sparkle:nth-child(2) {
  top: 35px;
  right: 12%;
}

.sparkle:nth-child(3) {
  bottom: 15px;
  left: 18%;
}

.sparkle:nth-child(4) {
  bottom: 20px;
  right: 18%;
}

@keyframes sparkle {
  0% {
    opacity: 0;
    transform: scale(.2) rotate(0deg);
  }
  35% {
    opacity: 1;
    transform: scale(1.5) rotate(90deg);
  }
  100% {
    opacity: 0;
    transform: scale(.5) rotate(180deg);
  }
}

/* RECIPIENT REVEAL */

.recipient {
  color: #a84440;
  font-size: clamp(35px, 9vw, 48px);
  font-weight: bold;
  margin: 22px 0;
  animation: revealName .9s cubic-bezier(.2,1.5,.5,1);
  overflow-wrap: anywhere;
}

@keyframes revealName {
  from {
    opacity: 0;
    transform: scale(.2) rotate(-8deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

#result {
  animation: fadeIn .8s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#error {
  color: #a84440;
  font-size: 14px;
}

.footer {
  color: #a09a8e;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 25px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="tree">🎄</div>

  <h1>Secret Santa 2026</h1>

  <p>A little Christmas magic is waiting for you!</p>

  <div id="welcome">

    <p id="person">Your surprise is ready...</p>

    <div class="gift-area" id="giftArea">

      <span class="sparkle">✨</span>
      <span class="sparkle">⭐</span>
      <span class="sparkle">✨</span>
      <span class="sparkle">🌟</span>

      <div class="gift">
        <div class="gift-base"></div>
        <div class="gift-lid"></div>
        <div class="bow">🎀</div>
      </div>

    </div>

    <button id="revealButton" onclick="reveal()">
      🎁 OPEN YOUR PRESENT
    </button>

    <p>Remember... shhh! It's a secret 🤫</p>

  </div>

  <div id="result" class="hidden">

    <div style="font-size:55px; margin:15px;">🎉</div>

    <p>YOUR SECRET SANTA PERSON IS...</p>

    <div class="recipient" id="recipient"></div>

    <p>Now go make some Christmas magic!</p>

    <div style="font-size:40px;">🎄 ❤️ 🎁</div>

    <p>Remember to keep it a secret! 🤫</p>

  </div>

  <p id="error"></p>

  <div class="footer">
    MADE WITH ♥ AND CHRISTMAS MAGIC
  </div>

</div>

<script>
async function reveal() {

  const token = new URLSearchParams(location.search).get("token");

  const button = document.getElementById("revealButton");
  const error = document.getElementById("error");

  if (!token) {
    error.textContent =
      "Please open your personal invitation link!";
    return;
  }

  button.disabled = true;
  button.textContent = "✨ OPENING YOUR PRESENT...";

  error.textContent = "";

  try {

    const response = await fetch(
      "/api/reveal/" + encodeURIComponent(token),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    // Animate the gift opening
    const giftArea = document.getElementById("giftArea");
    giftArea.classList.add("opening");

    // Wait for the gift animation before showing the name
    await new Promise(resolve => setTimeout(resolve, 1800));

    document.getElementById("person").textContent =
      "Hello, " + data.name + "!";

    document.getElementById("recipient").textContent =
      data.recipient;

    document.getElementById("welcome").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    // Clean the address bar after the reveal
    history.replaceState({}, "", location.pathname);

  } catch (err) {

    error.textContent =
      "Something went wrong. Please try again.";

    button.disabled = false;
    button.textContent = "🎁 OPEN YOUR PRESENT";

  }
}
</script>

</body>
</html>
